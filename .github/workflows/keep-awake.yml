# Keeps Peachey's free Supabase project from pausing.
# Supabase pauses free projects after a week with no activity; this asks the
# database a tiny question every three days so that never happens.
# It uses only the public key (the same one in .env.production), and the
# security rules mean it sees nothing: it just counts as activity.
# GitHub can also run it by hand: Actions → Keep Supabase awake → Run workflow.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 */3 * *'   # every third day, mid-morning Mountain time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database a tiny question
        env:
          SUPABASE_URL: https://uomtcdjnopurkehwjbnj.supabase.co
          SUPABASE_KEY: sb_publishable_HTlczrgXdy-2pysJ4HxxaA_uzpC9NsF
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase answered with HTTP $status"
          test "$status" = "200"
